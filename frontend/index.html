<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tele Tourist</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Tele Tourist</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-toggle="target" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="auth-links">
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-light text-primary fw-bold ms-2 px-3" href="register.html">Sign Up</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container text-center mt-5 pt-5">
        <h1 class="display-3 fw-bold text-primary mb-3">Tele Tourist</h1>
        <p class="lead text-secondary mb-5">Discover the world through real travelers.</p>
        
        <div class="d-flex justify-content-center gap-3" id="hero-actions">
            <button class="btn btn-primary btn-lg px-4 py-2">Explore</button>
            <a href="login.html" class="btn btn-outline-primary btn-lg px-4 py-2">Login</a>
            <a href="register.html" class="btn btn-secondary btn-lg px-4 py-2">Sign Up</a>
        </div>
    </main>

    <!-- jQuery and Bootstrap Bundle with Popper -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const heroActions = document.getElementById('hero-actions');
            if (Auth.isAuthenticated()) {
                heroActions.innerHTML = `
                    <button class="btn btn-primary btn-lg px-4 py-2">Explore</button>
                    <a href="profile.html" class="btn btn-outline-primary btn-lg px-4 py-2">Profile</a>
                `;
            }
        });
    </script>
    <script src="js/main.js"></script>
</body>
</html>

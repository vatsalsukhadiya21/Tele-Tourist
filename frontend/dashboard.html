<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Tele Tourist</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Tele Tourist</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="auth-links">
                    <!-- Auth links will be populated by auth.js -->
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body p-5 text-center">
                        <h2 class="fw-bold mb-4" id="welcome-message">Welcome, User</h2>
                        <div class="alert alert-success d-inline-block px-4 mb-4">
                            You are authenticated.
                        </div>
                        <div>
                            <button class="btn btn-outline-danger px-4" id="dashboard-logout-btn">Logout</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap Bundle with Popper -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Protect page
            Auth.requireAuth();

            // Fetch user info to show name
            const userRes = await Auth.fetchMe();
            if (userRes.success && userRes.user) {
                document.getElementById('welcome-message').textContent = `Welcome, ${userRes.user.fullName}`;
            }

            // Logout button
            document.getElementById('dashboard-logout-btn').addEventListener('click', () => {
                Auth.logout();
            });
        });
    </script>
    <script src="js/main.js"></script>
</body>
</html>

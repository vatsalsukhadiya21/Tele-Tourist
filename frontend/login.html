<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tele Tourist</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-primary">Login</h2>
                            <p class="text-muted">Welcome back to Tele Tourist</p>
                            <p class="test-muted">j</p>
                        </div>
                        <div id="message-container"></div>
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password"
                                    placeholder="Enter your password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2" id="login-btn">Login</button>
                        </form>
                        <div class="mt-3 text-center">
                            <p class="mb-1">Don't have an account? <a href="register.html"
                                    class="text-decoration-none">Register</a></p>
                            <p class="mb-0"><a href="index.html" class="text-decoration-none">Back to Home</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap Bundle with Popper -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgContainer = document.getElementById('message-container');
            const btn = document.getElementById('login-btn');

            btn.disabled = true;
            btn.textContent = 'Loading...';
            msgContainer.innerHTML = '';

            const res = await Auth.login(email, password);
            if (res.success) {
                window.location.href = 'profile.html';
            } else {
                msgContainer.innerHTML = `<div class="alert alert-danger">${res.message}</div>`;
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        });
    </script>
    <script src="js/main.js"></script>
</body>
</html>

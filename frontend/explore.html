<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - Tele Tourist</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Tele Tourist</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="auth-links">
                    <!-- Nav links populated by auth.js -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header Section -->
    <header class="bg-white border-bottom py-4 mb-4">
        <div class="container">
            <div class="row align-items-center justify-content-between">
                <div class="col-md-6 mb-3 mb-md-0">
                    <h2 class="fw-bold m-0">Explore Stories</h2>
                    <p class="text-muted m-0">Discover amazing travel experiences from around the world.</p>
                </div>
                <div class="col-md-6">
                    <form id="search-form" class="d-flex">
                        <input type="search" id="search-input" class="form-control me-2" placeholder="Search destinations, titles...">
                        <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </header>

    <div class="container pb-5">
        <!-- Category Filter -->
        <div class="mb-4">
            <div class="d-flex overflow-auto pb-2 gap-2" id="category-filters">
                <button class="btn btn-primary rounded-pill category-btn" data-category="All">All Categories</button>
                <!-- Categories populated by JS -->
            </div>
        </div>
        
        <!-- Results Container -->
        <div id="explore-results" class="row g-4">
            <!-- Cards go here -->
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <h5 class="mt-3 text-muted">Discovering travel stories...</h5>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center py-5 d-none">
            <h4 class="text-muted mb-3">No travel stories found.</h4>
            <p class="text-muted">Try another destination or category.</p>
            <button class="btn btn-outline-primary mt-2" id="clear-filters-btn">Clear Filters</button>
        </div>

        <!-- Error State -->
        <div id="error-state" class="alert alert-danger text-center d-none my-4">
            Unable to load travel stories. Please try again.
        </div>
    </div>

    <!-- jQuery and Bootstrap Bundle with Popper -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/explore.js"></script>
</body>
</html>

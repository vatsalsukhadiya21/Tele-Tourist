<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Stories - Tele Tourist</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Tele Tourist</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="auth-links">
                    <!-- Nav links -->
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold m-0">My Stories</h2>
            <a href="create-story.html" class="btn btn-primary">Create New Story</a>
        </div>
        
        <div id="stories-container" class="row g-4">
            <!-- Stories populated here -->
        </div>

        <div id="empty-state" class="text-center py-5 d-none">
            <h4 class="text-muted mb-3">You haven't shared a travel story yet.</h4>
            <a href="create-story.html" class="btn btn-outline-primary">Create Your First Story</a>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Delete Story</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this story? This action cannot be undone.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap Bundle with Popper -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/stories.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            Auth.requireAuth();

            const container = document.getElementById('stories-container');
            const emptyState = document.getElementById('empty-state');
            
            let storyToDelete = null;
            const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
            const confirmDeleteBtn = document.getElementById('confirm-delete-btn');

            async function loadStories() {
                container.innerHTML = '<div class="col-12 text-center py-5">Loading...</div>';
                const res = await StoryAPI.getMyStories();
                
                if (res.success) {
                    if (res.stories.length === 0) {
                        container.innerHTML = '';
                        emptyState.classList.remove('d-none');
                    } else {
                        emptyState.classList.add('d-none');
                        container.innerHTML = res.stories.map(story => `
                            <div class="col-md-6 col-lg-4" id="story-card-${story.id}">
                                <div class="card h-100 shadow-sm">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between mb-2">
                                            <span class="badge bg-secondary">${story.category ? story.category.name : 'Uncategorized'}</span>
                                            <small class="text-muted">${formatDate(story.created_at)}</small>
                                        </div>
                                        <h5 class="card-title fw-bold">${story.title}</h5>
                                        <h6 class="card-subtitle mb-3 text-muted"><i class="bi bi-geo-alt"></i> ${story.location}</h6>
                                        <p class="card-text text-truncate" style="max-height: 4.5em; overflow: hidden;">${story.description}</p>
                                    </div>
                                    <div class="card-footer bg-white border-top-0 d-flex gap-2">
                                        <a href="story.html?id=${story.id}" class="btn btn-sm btn-outline-primary flex-grow-1">View</a>
                                        <a href="create-story.html?edit=${story.id}" class="btn btn-sm btn-outline-secondary flex-grow-1">Edit</a>
                                        <button class="btn btn-sm btn-outline-danger" onclick="promptDelete('${story.id}')">Delete</button>
                                    </div>
                                </div>
                            </div>
                        `).join('');
                    }
                } else {
                    container.innerHTML = `<div class="col-12 text-danger">Failed to load stories: ${res.message}</div>`;
                }
            }

            window.promptDelete = (id) => {
                storyToDelete = id;
                deleteModal.show();
            };

            confirmDeleteBtn.addEventListener('click', async () => {
                if (storyToDelete) {
                    confirmDeleteBtn.disabled = true;
                    confirmDeleteBtn.textContent = 'Deleting...';
                    
                    const res = await StoryAPI.deleteStory(storyToDelete);
                    if (res.success) {
                        const card = document.getElementById(`story-card-${storyToDelete}`);
                        if (card) card.remove();
                        
                        // Check if empty
                        if (container.children.length === 0) {
                            emptyState.classList.remove('d-none');
                        }
                    } else {
                        alert(res.message);
                    }

                    deleteModal.hide();
                    confirmDeleteBtn.disabled = false;
                    confirmDeleteBtn.textContent = 'Delete';
                    storyToDelete = null;
                }
            });

            loadStories();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Tele Tourist</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-primary">Register</h2>
                            <p class="text-muted">Join Tele Tourist today</p>
                        </div>
                        <div id="message-container"></div>
                        <form id="register-form">
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullName" placeholder="John Doe" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Create a password" required minlength="6">
                            </div>
                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required minlength="6">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2" id="register-btn">Register</button>
                        </form>
                        <div class="mt-3 text-center">
                            <p class="mb-1">Already have an account? <a href="login.html" class="text-decoration-none">Login</a></p>
                            <p class="mb-0"><a href="index.html" class="text-decoration-none">Back to Home</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap Bundle with Popper -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const msgContainer = document.getElementById('message-container');
            const btn = document.getElementById('register-btn');

            if (password !== confirmPassword) {
                msgContainer.innerHTML = '<div class="alert alert-danger">Passwords do not match</div>';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Loading...';
            msgContainer.innerHTML = '';

            const res = await Auth.register(fullName, email, password);
            if (res.success) {
                msgContainer.innerHTML = '<div class="alert alert-success">Registration successful. Please login.</div>';
                document.getElementById('register-form').reset();
            } else {
                msgContainer.innerHTML = `<div class="alert alert-danger">${res.message}</div>`;
            }

            btn.disabled = false;
            btn.textContent = 'Register';
        });
    </script>
    <script src="js/main.js"></script>
</body>
</html>
